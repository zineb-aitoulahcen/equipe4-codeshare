<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeShare - Inscription</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 420px;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #3498db;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        .error-message {
            color: red;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .success-message {
            color: green;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #555;
        }

        .login-link a {
            color: #3498db;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📝 Inscription — CodeShare</h2>

        <div class="form-group">
            <label for="nom">Nom complet</label>
            <input type="text" id="nom" placeholder="Votre nom complet">
            <span class="error-message" id="nomError">Le nom est obligatoire</span>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="votre@email.com">
            <span class="error-message" id="emailError">Email invalide ou déjà utilisé</span>
        </div>

        <div class="form-group">
            <label for="mot_de_passe">Mot de passe</label>
            <input type="password" id="mot_de_passe" placeholder="Minimum 6 caractères">
            <span class="error-message" id="passwordError">Mot de passe obligatoire</span>
        </div>

        <button class="btn" onclick="inscrire()">S'inscrire</button>
        <div class="success-message" id="successMsg">
            ✅ Inscription réussie ! Redirection...
        </div>

        <div class="login-link">
            Déjà un compte ? <a href="login.html">Se connecter</a>
        </div>
    </div>

    <script>
        async function inscrire() {
            // Récupérer les valeurs
            const nom = document.getElementById('nom').value.trim();
            const email = document.getElementById('email').value.trim();
            const mot_de_passe = document.getElementById('mot_de_passe').value.trim();

            // Cacher les erreurs
            document.getElementById('nomError').style.display = 'none';
            document.getElementById('emailError').style.display = 'none';
            document.getElementById('passwordError').style.display = 'none';

            // Validation côté client
            let valid = true;

            if (!nom) {
                document.getElementById('nomError').style.display = 'block';
                valid = false;
            }

            if (!email) {
                document.getElementById('emailError').style.display = 'block';
                valid = false;
            }

            if (!mot_de_passe) {
                document.getElementById('passwordError').style.display = 'block';
                valid = false;
            }

            if (!valid) return;

            // Envoyer au backend
            try {
                const response = await fetch('http://localhost:3000/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nom, email, mot_de_passe })
                });

                const data = await response.json();

                if (response.ok) {
                    document.getElementById('successMsg').style.display = 'block';
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    document.getElementById('emailError').innerText = data.message;
                    document.getElementById('emailError').style.display = 'block';
                }

            } catch (error) {
                alert('Erreur serveur, réessayez plus tard');
            }
        }
    </script>
</body>
</html>
